<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <!-- Background M Gradients -->
    <linearGradient id="mLeftGrad" x1="120" y1="320" x2="250" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="40%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <linearGradient id="mRightGrad" x1="250" y1="80" x2="380" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <!-- Glass Rim & Specular Glow Gradients -->
    <linearGradient id="glassRimGrad" x1="120" y1="80" x2="380" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#E879F9" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Infinity Tube Gradient -->
    <linearGradient id="infGrad" x1="100" y1="200" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#C026D3" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#22D3EE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="infHighlight" x1="100" y1="170" x2="400" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FDF4FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Shadow & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="innerBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feOffset dx="-2" dy="-2" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#FFFFFF" flood-opacity="0.6" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <g opacity="0.45" filter="url(#neonGlow)">
    <path d="M140 85 L250 180 L360 85 L360 315 L320 315 L320 160 L250 220 L180 160 L180 315 L140 315 Z" fill="url(#mLeftGrad)" />
    <path d="M250 180 L360 85 L360 315 L320 315 L320 160 L250 220 Z" fill="url(#mRightGrad)" />
  </g>

  <!-- ==================== BASE "M" LETTER ==================== -->
  <g filter="url(#softShadow)">
    <!-- Base 3D M Body -->
    <path
      d="M136 92 C136 84 142 78 150 78 L170 78 C176 78 182 81 186 86 L250 165 L314 86 C318 81 324 78 330 78 L350 78 C358 78 364 84 364 92 L364 308 C364 316 358 322 350 322 L326 322 C318 322 312 316 312 308 L312 166 L262 228 C256 235 244 235 238 228 L188 166 L188 308 C188 316 182 322 174 322 L150 322 C142 322 136 316 136 308 Z"
      fill="url(#mLeftGrad)"
      stroke="url(#glassRimGrad)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Right Half Color Overlay for seamless blend -->
    <path
      d="M250 165 L314 86 C318 81 324 78 330 78 L350 78 C358 78 364 84 364 92 L364 308 C364 316 358 322 350 322 L326 322 C318 322 312 316 312 308 L312 166 L262 228 C259 231 254 233 250 233 Z"
      fill="url(#mRightGrad)"
      fill-opacity="0.9"
    />

    <!-- M Glass Reflections & Inner Specular Lines -->
    <!-- Left Pillar Inner Glow -->
    <path
      d="M144 95 L144 305"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-opacity="0.55"
    />
    <!-- Right Pillar Inner Glow -->
    <path
      d="M356 95 L356 305"
      stroke="#E0F2FE"
      stroke-width="3"
      stroke-linecap="round"
      stroke-opacity="0.65"
    />
    <!-- Left Chevron Specular -->
    <path
      d="M176 96 L244 180"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-opacity="0.6"
    />
    <!-- Right Chevron Specular -->
    <path
      d="M324 96 L256 180"
      stroke="#A5F3FC"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-opacity="0.7"
    />
  </g>

  <!-- ==================== INTERTWINED INFINITY TUBE (FRONT & LOOPS) ==================== -->
  <g filter="url(#softShadow)">
    <!-- Infinity Outer Glass Tube Path -->
    <!-- Left Loop Center ~ (185, 205), Right Loop Center ~ (315, 205), Cross at (250, 205) -->
    
    <!-- Outer Thick Tube Body -->
    <path
      d="M 250,205 
         C 285,155 375,145 375,205 
         C 375,265 285,255 250,205 
         C 215,155 125,145 125,205 
         C 125,265 215,255 250,205 Z"
      fill="none"
      stroke="url(#infGrad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Core Refraction -->
    <path
      d="M 250,205 
         C 285,155 375,145 375,205 
         C 375,265 285,255 250,205 
         C 215,155 125,145 125,205 
         C 125,265 215,255 250,205 Z"
      fill="none"
      stroke="url(#glassRimGrad)"
      stroke-width="38"
      stroke-opacity="0.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Hollow Loops Cutout Effect -->
    <path
      d="M 250,205 
         C 285,155 375,145 375,205 
         C 375,265 285,255 250,205 
         C 215,155 125,145 125,205 
         C 125,265 215,255 250,205 Z"
      fill="none"
      stroke="#06090e"
      stroke-width="12"
      stroke-opacity="0.25"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Glass Specular Highlight Track (Top Edge Refraction) -->
    <path
      d="M 248,198 
         C 280,150 365,142 365,198 
         M 248,212 
         C 216,260 135,268 135,212"
      fill="none"
      stroke="url(#infHighlight)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-opacity="0.85"
    />

    <path
      d="M 252,212 
         C 284,260 365,268 365,212 
         M 252,198 
         C 220,150 135,142 135,198"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-opacity="0.6"
    />

    <!-- Central Crossing Glint / Lens Refraction Flare -->
    <ellipse cx="250" cy="205" rx="8" ry="8" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="250" cy="205" r="4" fill="#A5F3FC" />

    <!-- Left Loop Glow Node -->
    <ellipse cx="155" cy="180" rx="14" ry="5" transform="rotate(-30 155 180)" fill="#FFFFFF" fill-opacity="0.6" />
    
    <!-- Right Loop Glow Node -->
    <ellipse cx="345" cy="180" rx="14" ry="5" transform="rotate(30 345 180)" fill="#FFFFFF" fill-opacity="0.7" />
  </g>

  <!-- Lower Ambient Reflection for Glass Bottom -->
  <ellipse cx="250" cy="335" rx="130" ry="12" fill="url(#mRightGrad)" fill-opacity="0.15" filter="url(#neonGlow)" />
</svg>
